name: spritedawg
description: Offline, touch-first pixel art and Aseprite editor for Android and Linux.
publish_to: none
version: 0.3.0+5
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  image: 4.12.0
  flutter_avif_platform_interface: 3.1.0
  flutter_avif_android: 3.1.0
  spritedawg_avif_linux:
    path: packages/spritedawg_avif_linux
  file_selector: ^1.0.4
  path_provider: ^2.1.5
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - art/spritedawg-256.png
