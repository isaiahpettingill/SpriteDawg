name: SpriteDawg Flutter
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_VERSION: '3.47.8'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: python3 scripts/fetch-fixtures.py
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Cross-check output with independent Aseprite parser
        run: |
          dart tool/aseprite_interop.dart
          git clone https://github.com/TheCyberRonin/ase-parser.git /tmp/spritedawg-ase-parser
          git -C /tmp/spritedawg-ase-parser checkout 550bde9ec5d3dc03571d7ea5acd9612a49c61a80
          node scripts/check-ase-parser.cjs /tmp/spritedawg-ase-parser/Aseprite.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: flutter pub get
      - run: python3 scripts/fetch-fixtures.py
      - run: flutter build apk --debug
      - run: dart tool/aseprite_interop.dart
      - run: cd android && ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
        env:
          SPRITEDAWG_INTEROP_DIR: /tmp/spritedawg-dart-interop
      - uses: actions/upload-artifact@v4
        with:
          name: spritedawg-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports
          path: build/app/reports/
  android-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: flutter test integration_test/editor_smoke_test.dart -d emulator-5554 --reporter expanded
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bootstrap official Flutter tag on ARM64
        if: matrix.arch == 'arm64'
        run: |
          # Stable archives omit Linux ARM64; the official SDK bootstrap supports it.
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - run: flutter build linux --release
      - run: scripts/package-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: spritedawg-linux-${{ matrix.arch }}
          path: build/spritedawg-linux-${{ matrix.arch }}.tar.gz*

  signed-android:
    if: github.event_name == 'push'
    needs: [test, android, android-interaction]
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.POCKET_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Explain optional signing
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo 'No existing release key configured. Side-by-side debug APK remains available; no key was generated.'
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build with existing permanent key (artifact only)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
          POCKET_KEYSTORE: ${{ runner.temp }}/spritedawg-release.jks
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$POCKET_KEYSTORE"
          trap 'rm -f "$POCKET_KEYSTORE"' EXIT
          flutter pub get
          flutter build apk --release
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          name: spritedawg-android-signed
          path: build/app/outputs/flutter-apk/app-release.apk*
