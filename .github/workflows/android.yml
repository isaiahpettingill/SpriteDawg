name: SpriteDawg Flutter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Run every suite manually, including device and parser checks.
permissions:
  contents: read
concurrency:
  group: spritedawg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_VERSION: '3.47.8'
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
      tag: ${{ steps.plan.outputs.tag }}
      native: ${{ steps.ci.outputs.native }}
      device: ${{ steps.ci.outputs.device }}
      interop: ${{ steps.ci.outputs.interop }}
      linux: ${{ steps.ci.outputs.linux }}
      reused_run: ${{ steps.ci.outputs.reused_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_plan.py >> "$GITHUB_OUTPUT"
      - id: plan
        run: python3 scripts/release-plan.py --run-number "$GITHUB_RUN_NUMBER" --format env >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
  test:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-dependency-lock
          path: pubspec.lock
          retention-days: 7
          overwrite: true
      - run: python3 scripts/fetch-fixtures.py
      - name: Check Dart formatting
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            dart format lib test
            git diff --exit-code -- lib test
          fi
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Render deterministic Bark brush preview
        run: dart tool/bark_preview.dart
      - uses: actions/upload-artifact@v4
        with:
          name: bark-brush-preview
          path: build/bark-preview.png
          retention-days: 7
          overwrite: true
      - name: Render production Leaves and Splatter preview
        run: dart tool/new_brush_preview.dart
      - uses: actions/upload-artifact@v4
        with:
          name: leaves-splatter-preview
          path: build/new-brush-preview.png
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Capture compact frame panels
        run: |
          font="$(fc-match -f '%{file}' sans)"
          test -f "$font"
          flutter test test/frame_panel_capture_test.dart --dart-define=CAPTURE_UI=true --dart-define="CAPTURE_FONT=$font"
      - uses: actions/upload-artifact@v4
        with:
          name: frame-panel-ui
          path: build/ui/frames-*.png
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Verify exports with independent Pillow decoders
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
          dart tool/image_export_interop.dart
          python3 scripts/check-image-exports.py build/export-interop
      - name: Cross-check output with independent Aseprite parser
        if: needs.version.outputs.interop == 'true'
        run: |
          dart tool/aseprite_interop.dart
          git clone https://github.com/TheCyberRonin/ase-parser.git /tmp/spritedawg-ase-parser
          git -C /tmp/spritedawg-ase-parser checkout 550bde9ec5d3dc03571d7ea5acd9612a49c61a80
          node scripts/check-ase-parser.cjs /tmp/spritedawg-ase-parser/Aseprite.js
      - name: Record actual tested checkout tree
        run: python3 scripts/ci_plan.py record
      - uses: actions/upload-artifact@v4
        with:
          name: validated-tree
          path: ci-tree.json
          retention-days: 14
          overwrite: true
  android:
    needs: [version]
    if: needs.version.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: flutter pub get
      - run: python3 scripts/fetch-fixtures.py
      - run: flutter build apk --debug
      - run: dart tool/aseprite_interop.dart
      - run: dart tool/brush_interop.dart /tmp/spritedawg-dart-brush-interop
      - run: cd android && ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
        env:
          SPRITEDAWG_INTEROP_DIR: /tmp/spritedawg-dart-interop
          SPRITEDAWG_BRUSH_INTEROP_DIR: /tmp/spritedawg-dart-brush-interop
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: spritedawg-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: native-test-reports
          path: build/app/reports/
  android-interaction:
    needs: [version]
    if: needs.version.outputs.device == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            flutter test integration_test/editor_smoke_test.dart -d emulator-5554 --reporter expanded
            flutter test integration_test/export_codec_test.dart -d emulator-5554 --reporter expanded
  linux:
    needs: [version]
    if: needs.version.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install missing Linux build dependencies (bounded retries)
        timeout-minutes: 15
        run: bash scripts/install-linux-deps.sh
      - name: Select pinned Rust codec toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: avif-cargo-${{ matrix.arch }}-${{ hashFiles('packages/spritedawg_avif_linux/rust/Cargo.lock') }}
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bootstrap official Flutter tag on ARM64
        if: matrix.arch == 'arm64'
        run: |
          # Stable archives omit Linux ARM64; the official SDK bootstrap supports it.
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - run: flutter build linux --verbose --release --build-name "${{ needs.version.outputs.version }}" --build-number "${{ needs.version.outputs.build_number }}"
      - name: Verify architecture-native AVIF with independent decoder
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
          codec="$(find build/linux -path '*/bundle/lib/libflutter_avif.so' -print -quit)"
          test -n "$codec"
          dart tool/image_export_interop.dart build/export-interop "$(realpath "$codec")"
          python3 scripts/check-image-exports.py build/export-interop --require-avif
      - run: scripts/package-linux.sh ${{ matrix.arch }} "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: spritedawg-linux-${{ matrix.arch }}
          path: build/spritedawg-linux-${{ matrix.arch }}.tar.gz*

  signed-android:
    timeout-minutes: 25
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.test.result == 'success' &&
      (needs.android.result == 'success' || (needs.version.outputs.native == 'false' && needs.android.result == 'skipped')) &&
      (needs.android-interaction.result == 'success' || (needs.version.outputs.device == 'false' && needs.android-interaction.result == 'skipped'))
    needs: [version, test, android, android-interaction]
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.POCKET_KEYSTORE_BASE64 != '' && secrets.POCKET_STORE_PASSWORD != '' && secrets.POCKET_KEY_ALIAS != '' && secrets.POCKET_KEY_PASSWORD != '' }}
    steps:
      - name: Require the existing permanent key
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo '::error::All four existing POCKET signing secrets are required. No fallback or new key is allowed.'
          exit 1
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build and verify production APKs with the existing permanent key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
          POCKET_KEYSTORE: ${{ runner.temp }}/spritedawg-release.jks
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$POCKET_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$POCKET_KEYSTORE"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          version="${{ needs.version.outputs.version }}"
          build_number="${{ needs.version.outputs.build_number }}"
          flutter pub get
          flutter build apk --release --split-per-abi --build-name "$version" --build-number "$build_number"
          mkdir -p signed-assets
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signer-$abi.txt"
            if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/signer-$abi.txt"; then
              echo '::error::Refusing a development signing certificate.'
              exit 1
            fi
            grep -qi 'Signer #1 certificate SHA-256 digest: 8c66b44614c82edfa120b99f05101d938dbf6afac70d2ad8c55c058c757dd296' "$RUNNER_TEMP/signer-$abi.txt" || { echo "::error::Permanent signing certificate mismatch for $abi"; exit 1; }
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            grep -q "^package: name='org.pocketpixel' " <<< "$badging"
            case "$abi" in
              armeabi-v7a) offset=1000 ;; arm64-v8a) offset=2000 ;; x86_64) offset=4000 ;;
            esac
            grep "^package:" <<< "$badging"
            grep -q "versionCode='$((build_number + offset))'" <<< "$badging" || { echo "::error::Unexpected ABI versionCode for $abi"; exit 1; }
            grep -q "versionName='$version'" <<< "$badging"
            if grep -q 'application-debuggable' <<< "$badging"; then
              echo '::error::Refusing a debuggable APK.'
              exit 1
            fi
            permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk")
            if grep -q 'android.permission.INTERNET' <<< "$permissions"; then
              echo '::error::The offline production app must not request INTERNET.'
              exit 1
            fi
            cp "$apk" "signed-assets/spritedawg-v$version-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          overwrite: true
          name: spritedawg-android-signed
          path: signed-assets/*.apk
          if-no-files-found: error

  release:
    timeout-minutes: 10
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.test.result == 'success' &&
      needs.linux.result == 'success' && needs.signed-android.result == 'success' &&
      (needs.android.result == 'success' || (needs.version.outputs.native == 'false' && needs.android.result == 'skipped')) &&
      (needs.android-interaction.result == 'success' || (needs.version.outputs.device == 'false' && needs.android-interaction.result == 'skipped'))
    needs: [version, test, android, android-interaction, linux, signed-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: spritedawg-production-release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Use the same immutable build identifiers
        run: |
          echo 'RELEASE_VERSION=${{ needs.version.outputs.version }}' >> "$GITHUB_ENV"
          echo 'RELEASE_TAG=${{ needs.version.outputs.tag }}' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: spritedawg-android-signed
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: spritedawg-linux-x64
          path: downloaded/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: spritedawg-linux-arm64
          path: downloaded/linux-arm64
      - name: Assemble production assets and basename-only checksums
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            test -s "release-assets/spritedawg-v$RELEASE_VERSION-android-$abi.apk"
          done
          for arch in x64 arm64; do
            source="downloaded/linux-$arch/spritedawg-linux-$arch.tar.gz"
            test -s "$source"
            tar -tzf "$source" > /dev/null
            cp "$source" "release-assets/spritedawg-v$RELEASE_VERSION-linux-$arch.tar.gz"
          done
          cp scripts/install-spritedawg.sh release-assets/install-spritedawg.sh
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum *.apk *.tar.gz *.sh > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish or safely resume this tested main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tag "$RELEASE_TAG" --assets release-assets --notes RELEASE_NOTES.md
