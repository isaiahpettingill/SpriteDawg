name: SpriteDawg Flutter
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_VERSION: '3.47.8'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: python3 scripts/fetch-fixtures.py
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Cross-check output with independent Aseprite parser
        run: |
          dart tool/aseprite_interop.dart
          git clone https://github.com/TheCyberRonin/ase-parser.git /tmp/spritedawg-ase-parser
          git -C /tmp/spritedawg-ase-parser checkout 550bde9ec5d3dc03571d7ea5acd9612a49c61a80
          node scripts/check-ase-parser.cjs /tmp/spritedawg-ase-parser/Aseprite.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: flutter pub get
      - run: python3 scripts/fetch-fixtures.py
      - run: flutter build apk --debug
      - run: dart tool/aseprite_interop.dart
      - run: cd android && ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
        env:
          SPRITEDAWG_INTEROP_DIR: /tmp/spritedawg-dart-interop
      - uses: actions/upload-artifact@v4
        with:
          name: spritedawg-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports
          path: build/app/reports/
  android-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: flutter test integration_test/editor_smoke_test.dart -d emulator-5554 --reporter expanded
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Bootstrap official Flutter tag on ARM64
        if: matrix.arch == 'arm64'
        run: |
          # Stable archives omit Linux ARM64; the official SDK bootstrap supports it.
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - run: flutter build linux --release
      - run: scripts/package-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: spritedawg-linux-${{ matrix.arch }}
          path: build/spritedawg-linux-${{ matrix.arch }}.tar.gz*

  signed-android:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, android, android-interaction]
    runs-on: ubuntu-latest
    env:
      RELEASE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) }}
      HAS_SIGNING_KEY: ${{ secrets.POCKET_KEYSTORE_BASE64 != '' && secrets.POCKET_STORE_PASSWORD != '' && secrets.POCKET_KEY_ALIAS != '' && secrets.POCKET_KEY_PASSWORD != '' }}
    steps:
      - name: Require the existing permanent key for an explicit release
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          if [[ "$RELEASE_REQUESTED" == true ]]; then
            echo '::error::All four existing POCKET signing secrets must be configured. No fallback or new key is allowed.'
            exit 1
          fi
          echo 'Permanent release signing is not configured; debug CI artifacts are not releases.'
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build and verify production APKs with the existing permanent key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
          POCKET_KEYSTORE: ${{ runner.temp }}/spritedawg-release.jks
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$POCKET_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$POCKET_KEYSTORE"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::Release tag must match pubspec.yaml version.'
            exit 1
          fi
          flutter pub get
          flutter build apk --release --split-per-abi
          mkdir -p signed-assets
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signer-$abi.txt"
            if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/signer-$abi.txt"; then
              echo '::error::Refusing a development signing certificate.'
              exit 1
            fi
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            grep -q "^package: name='org.pocketpixel' " <<< "$badging"
            if grep -q 'application-debuggable' <<< "$badging"; then
              echo '::error::Refusing a debuggable APK.'
              exit 1
            fi
            permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk")
            if grep -q 'android.permission.INTERNET' <<< "$permissions"; then
              echo '::error::The offline production app must not request INTERNET.'
              exit 1
            fi
            cp "$apk" "signed-assets/spritedawg-v$version-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING_KEY == 'true'
        with:
          name: spritedawg-android-signed
          path: signed-assets/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')))
    needs: [test, android, android-interaction, linux, signed-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: spritedawg-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: spritedawg-android-signed
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: spritedawg-linux-x64
          path: downloaded/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: spritedawg-linux-arm64
          path: downloaded/linux-arm64
      - name: Assemble production assets and basename-only checksums
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            test -s "release-assets/spritedawg-v$RELEASE_VERSION-android-$abi.apk"
          done
          for arch in x64 arm64; do
            source="downloaded/linux-$arch/spritedawg-linux-$arch.tar.gz"
            test -s "$source"
            tar -tzf "$source" > /dev/null
            cp "$source" "release-assets/spritedawg-v$RELEASE_VERSION-linux-$arch.tar.gz"
          done
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum *.apk *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish a new version without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # API errors fail this job; they must not be mistaken for an absent release.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if grep -Fxq "$RELEASE_TAG" <<< "$tags"; then
            echo '::error::This release already exists. Inspect it explicitly; no assets were overwritten.'
            exit 1
          fi
          refs=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [[ -n "$refs" ]]; then
            # Prefer the peeled commit for an annotated tag.
            tag_commit=$(awk '{ if ($2 ~ /\^\{\}$/) peeled=$1; else direct=$1 } END { print peeled != "" ? peeled : direct }' <<< "$refs")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo '::error::The version tag already points at a different commit; refusing to publish mismatched assets.'
              exit 1
            fi
          fi
          # A marked main merge creates its version tag at the exact tested commit.
          # A pre-existing tag trigger must already exist and match pubspec.yaml.
          tag_options=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag_options+=(--verify-tag); fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${tag_options[@]}" \
            --title "SpriteDawg $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
